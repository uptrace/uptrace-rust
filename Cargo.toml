[package]
name = "uptrace"
version = "0.33.0"
edition = "2021"
rust-version = "1.88"
license-file = "./LICENSE"
description = "OpenTelemetry Rust distribution for Uptrace"
repository = "https://github.com/uptrace/uptrace-rust"
documentation = "https://docs.rs/uptrace"
homepage = "https://uptrace.dev/get/opentelemetry-rust"
keywords = ["opentelemetry", "tracing", "metrics", "logs", "uptrace"]
categories = ["development-tools::debugging", "development-tools::profiling"]
exclude = [".github/*", "examples/*"]

[features]
default = ["http", "internal-logs"]
# Export over OTLP/HTTP (protobuf + gzip) using a blocking reqwest client.
http = [
    "opentelemetry-otlp/http-proto",
    "opentelemetry-otlp/reqwest-blocking-client",
    "opentelemetry-otlp/reqwest-rustls",
    "opentelemetry-otlp/gzip-http",
]
# Export over OTLP/gRPC using tonic. Requires a Tokio runtime.
grpc = [
    "opentelemetry-otlp/grpc-tonic",
    "opentelemetry-otlp/gzip-tonic",
    "opentelemetry-otlp/tls-ring",
    "opentelemetry-otlp/tls-roots",
]
# Integrate with the `tracing` crate (spans and log events).
tracing = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-opentelemetry",
    "dep:opentelemetry-appender-tracing",
]
# Report internal warnings (e.g. disabled Uptrace) via OpenTelemetry internal logs.
internal-logs = ["opentelemetry/internal-logs", "opentelemetry_sdk/internal-logs"]

[dependencies]
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry-resource-detectors = "0.13"
opentelemetry-semantic-conventions = "0.33"
percent-encoding = "2"
rand = "0.9"
thiserror = "2"
url = "2"

tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }
opentelemetry-appender-tracing = { version = "0.33", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
